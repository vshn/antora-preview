name: Create and publish a container image

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TEST_IMAGE: antora-preview:test

jobs:
  # The image is published for both architectures, and most of the people
  # running it day to day are on arm64 Macs, so both architectures get tested.
  # Each runs on a native runner: under QEMU an Antora build takes long enough
  # to make the timeouts in the smoke test meaningless.
  smoke-test:
    name: Smoke test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build into the runner's Docker daemon so the smoke test can start the
      # image. Everything that can break here (Antora, Caddy, Ruby, guard and
      # its plugins) only runs at container start, and the base image is bumped
      # automatically by Renovate, so a green `docker build` proves very little.
      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Smoke test
        run: test/smoke-test.sh "${{ env.TEST_IMAGE }}"

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      # The released version is the version of the antora base image plus the
      # revision in REVISION, so that a change to this repository alone can be
      # released without waiting for a new antora release. Bump REVISION when
      # you need a new release and the base image has not moved.
      - name: Determine image version
        id: version
        run: |
          ANTORA_VERSION=$(sed -n 's/^FROM ghcr\.io\/vshn\/antora:\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' Dockerfile)
          REVISION=$(tr -d '[:space:]' < REVISION)
          if [ -z "$ANTORA_VERSION" ] || [ -z "$REVISION" ]; then
            echo "cannot determine version: antora='$ANTORA_VERSION' revision='$REVISION'" >&2
            exit 1
          fi
          echo "version=${ANTORA_VERSION}.${REVISION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: 'arm64,amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/master' }}

      # Both architectures were just built natively by the smoke-test jobs, so
      # this mostly assembles the manifest from their cached layers.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64

      # Tag and release only after the image has passed the smoke test on both
      # architectures and been published, so a broken build never gets a release.
      - name: Create git tag and release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "Tag $VERSION already exists, skipping"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
            gh release create "$VERSION" --title "$VERSION" --generate-notes
          fi
